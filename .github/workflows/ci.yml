name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Frontend type check and build
        run: |
          npm ci
          npm run build

      # The real models aren't needed for unit tests; the bundler just needs the resources glob to match
      - name: Placeholder models folder
        shell: pwsh
        run: New-Item -ItemType File -Force src-tauri/models/.placeholder | Out-Null

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test
