name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Frontend type check and build
        run: |
          npm ci
          npm run build

      # rust-cache restores sherpa-onnx's prebuilt folder without its libraries,
      # which makes the build skip the download and fail to link; start clean
      - name: Clear partial sherpa-onnx download
        shell: pwsh
        run: Get-ChildItem src-tauri/target -Directory -Recurse -Filter sherpa-onnx-prebuilt -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force

      # The real models aren't needed for unit tests; the bundler just needs the resources glob to match
      - name: Placeholder models folder
        shell: pwsh
        run: New-Item -ItemType File -Force src-tauri/models/.placeholder | Out-Null

      # Release mode: sherpa-onnx's prebuilt static libraries link reliably there,
      # and it's the same configuration the installer is built with
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --release
