name: Release

# Builds the Windows installer and attaches it to a GitHub release.
# Push a tag such as v0.1.0 to run it, or start it manually from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # rust-cache restores sherpa-onnx's prebuilt folder without its libraries,
      # which makes the build skip the download and fail to link; start clean
      - name: Clear partial sherpa-onnx download
        shell: pwsh
        run: Get-ChildItem src-tauri/target -Directory -Recurse -Filter sherpa-onnx-prebuilt -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force

      - name: Download voice models
        shell: pwsh
        run: ./scripts/download-models.ps1

      - name: Install dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Sayzo v__VERSION__
          releaseBody: See CHANGELOG.md for what's new. Download the setup .exe below and run it.
          releaseDraft: true
          prerelease: false
